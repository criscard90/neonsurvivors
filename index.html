  /* ---------- camera: insegue offset per far sembrare lo spazio "microscopico" che scorre ---------- */
  setupCamera() {
    this.cam.w = this.res.W; this.cam.h = this.res.H;
    try { this.camera.setBounds(-RES.W * 0.3, -RES.H * 0.3, AREA.W + RES.W * 0.6, AREA.H + RES.H * 0.6); } catch (e) { }
    try { this.camera.setDeadzone(0); } catch (e) { }
    const s = Math.max(this.res.W / RES.W, this.res.H / RES.H);
    this.camZoom = 1 / s;
    try { this.camera.setZoom(this.camZoom); } catch (e) { }
    try { if (this.camera && this.camera.centerOn) this.camera.centerOn(AREA.W / 2, AREA.H / 2); } catch (e) { }
  }
/* ---------- utilità colore ---------- */
  lerpCol = (c1, c2, t) => {
    const r = Math.round(((c1 >> 16) & 255) + (((c2 >> 16) & 255) - ((c1 >> 16) & 255)) * t);
    const g = Math.round(((c1 >> 8) & 255) + (((c2 >> 8) & 255) - ((c1 >> 8) & 255)) * t);
    const b = Math.round((c1 & 255) + ((c2 & 255) - (c1 & 255)) * t);
    return (r << 16) | (g << 8) | b;
  };

  /* ---------- scenario: MAI nero né tinta unita ---------- */
  buildScenery() {
    const X0 = -RES.W * 0.5, Y0 = -RES.H * 0.5;
    const X1 = AREA.W + RES.W * 0.5, Y1 = AREA.H + RES.H * 0.5;

    /* gradiente verticale per fasce */
    const bands = 30, step = (Y1 - Y0) / bands;
    for (let i = 0; i < bands; i++) {
      const t = i / (bands - 1);
      const col = t < 0.5 ? this.lerpCol(PAL.bgTop, PAL.bgMid, t * 2) : this.lerpCol(PAL.bgMid, PAL.bgBot, (t - 0.5) * 2);
      const r = mkr(this.gRound, X0, Y0 + i * step, X1 - X0, step + 1, col);
      if (r) { r.setDepth(1); r.setAlpha(0.9 + Math.sin(i * 1.7) * 0.1); }
    }

    /* griglia "da vetrino" */
    const GRID = 110;
    for (let x = X0; x < X1; x += GRID) {
      const l = mkr(this.gRound, x, Y0, 2, Y1 - Y0, PAL.grid);
      if (l) { l.setDepth(2); l.setAlpha(0.10); }
    }
    for (let y = Y0; y < Y1; y += GRID) {
      const l = mkr(this.gRound, X0, y, X1 - X0, 2, PAL.grid);
      if (l) { l.setDepth(2); l.setAlpha(0.10); }
    }
    const GRID2 = 330;
    for (let x = X0; x < X1; x += GRID2) {
      const l = mkr(this.gRound, x, Y0, 4, Y1 - Y0, PAL.grid2);
      if (l) { l.setDepth(2); l.setAlpha(0.14); }
    }
    for (let y = Y0; y < Y1; y += GRID2) {
      const l = mkr(this.gRound, X0, y, X1 - X0, 4, PAL.grid2);
      if (l) { l.setDepth(2); l.setAlpha(0.14); }
    }

    /* organelli decorativi: nuclei, vacuoli, mitocondri, DNA, batteri morti */
    for (let i = 0; i < 90; i++) {
      const x = rnd(X0, X1), y = rnd(Y0, Y1);
      const k = Math.floor(rnd(0, 5));
      if (k === 0) { /* nucleo */
        const r = rnd(46, 110);
        const a = mkc(this.gDecor, x, y, r, 0x1d4c7e);
        if (a) { a.setDepth(3); a.setAlpha(0.30); }
        const b = mkc(this.gDecor, x, y, r * 0.55, 0x2f6fb8);
        if (b) { b.setDepth(3); b.setAlpha(0.42); }
      } else if (k === 1) { /* vacuolo */
        const r = rnd(20, 55);
        const a = mkc(this.gDecor, x, y, r, 0x3a7fbf);
        if (a) { a.setDepth(3); a.setAlpha(0.18); strokeOn(a, 0x6fa8dd, 2); }
      } else if (k === 2) { /* mitocondrio */
        const a = es(this.gDecor, x, y, rnd(46, 95), rnd(22, 38), 0x2c66a8);
        if (a) { a.setDepth(3); a.setAlpha(0.22); a.setRotation(rnd(0, 6.28)); strokeOn(a, 0x4f91c8, 2); }
      } else if (k === 3) { /* filamento DNA */
        const base = rnd(0, 6.28), amp = rnd(24, 60), len = rnd(4, 9);
        for (let j = 0; j < len; j++) {
          const px = x + j * 34, py = y + Math.sin(base + j * 0.9) * amp;
          const a = mkc(this.gDecor, px, py, 4, 0x5fa8dd);
          if (a) { a.setDepth(3); a.setAlpha(0.30); }
        }
      } else { /* spora quiescente */
        const a = mkc(this.gDecor, x, y, rnd(14, 26), 0x47c0c0);
        if (a) { a.setDepth(3); a.setAlpha(0.14); strokeOn(a, 0x47c0c0, 1); }
      }
    }
  }

    this.pl = {

        ring: mkc(this.gPlayer, px, py, 30, 0x0a3a55),
        eye: mkc(this.gPlayer, px, py, 7, 0xffffff),
        pup: mkc(this.gPlayer, px, py, 3.5, 0x0a1a2a),
        arm1: mks(this.gPlayer, px, py, 9, 3, PAL.quark2),

    };
    strokeOn(this.pl.shape.quark, 0x0d5c8a, 2);

  /* ---------- input: tastiera + touch/click ---------- */
  bindInput() {
    /* stato tastiera via e.code (API DOM stabile, indipendente da KeyCodes/isDown) */
    this.keysDown = {};
    this.input.keyboard.on('keydown', (e) => {
      if (e && e.code) this.keysDown[e.code] = true;
      if (this.st === 'levelup' && this._opts && e.key >= '1' && e.key <= '3') {
        const idx = parseInt(e.key, 10) - 1;
        if (this._opts[idx]) { this.applyUpgrade(this._opts[idx]); }
        return;
      }
      const act = (e.code === 'Space' || e.code === 'Enter' || e.key === ' ' || e.key === 'Enter');
      if (this.st === 'title' && act) { this.startLevel(0); return; }
      if ((this.st === 'gameover' || this.st === 'victory') && act) { this.replay(); return; }
      if (e.code === 'Space' || e.key === ' ') this.tryDash();
    });
    this.input.keyboard.on('keyup', (e) => { if (e && e.code) this.keysDown[e.code] = false; });

    this.input.on('pointerdown', (p) => {
      if (this.st === 'title') { this.startLevel(0); return; }
      if (this.st === 'gameover') { this.replay(); return; }
      if (this.st === 'victory') { this.replay(); return; }
      if (this.st === 'levelup') { this.pickUpgradeScreen(p.x, p.y); return; }
      if (this.st === 'run' || this.st === 'boss') {
        this.tryDash();
        this.joystick.active = true;
        this.joystick.bx = p.x; this.joystick.by = p.y;
        this.joystick.dx = 0; this.joystick.dy = 0;
        this.stickShow(p.x, p.y);
      }
    });
    this.input.on('pointermove', (p) => {
      if (this.joystick.active) {
        const dx = p.x - this.joystick.bx, dy = p.y - this.joystick.by;
        const d = Math.hypot(dx, dy), m = 90;
        const s = Math.min(1, d / m);
        this.joystick.dx = (d > 4 ? dx / d : 0) * s;
        this.joystick.dy = (d > 4 ? dy / d : 0) * s;
        this.stickMove(p.x, p.y);
      }
    });
    this.input.on('pointerup', (p) => {
      this.joystick.active = false;
      this.joystick.dx = 0; this.joystick.dy = 0;
      this.stickHide();
    });
  }

  stickShow(x, y) {
    if (!this.joystick.base) {
      this.joystick.base = mkc(this.gHud, x, y, 70, 0x123a5a);
      this.joystick.knob = mkc(this.gHud, x, y, 26, 0x4fb8e8);
      this.joystick.base.setDepth(96); this.joystick.knob.setDepth(97);
      try { this.joystick.base.setScrollFactor(0); this.joystick.knob.setScrollFactor(0); } catch (e) { }
    } else { this.joystick.base.setPosition(x, y); this.joystick.knob.setPosition(x, y); }
    if (this.joystick.base) this.joystick.base.setAlpha(0.5);
    if (this.joystick.knob) this.joystick.knob.setAlpha(0.9);
  }
  stickMove(x, y) { if (this.joystick.knob) this.joystick.knob.setPosition(x, y); }
  stickHide() {
    if (this.joystick.base) this.joystick.base.setAlpha(0);
    if (this.joystick.knob) this.joystick.knob.setAlpha(0);
  }

  tryDash() {
    if (this.st !== 'run' && this.st !== 'boss') return;
    if (this.dashCd > 0) return;
    this.dashCd = PLAYER.DASH_CD;
    const [dx, dy] = norm(this.joystick.dx, this.joystick.dy);
    const len = PLAYER.DASH_DIST;
    this.pl.dashDx = dx * len; this.pl.dashDy = dy * len;
    this.pl.dashT = 0.21;
    this.boom = Math.max(this.boom, 0.35);
  }

  /* ---------- ondate: tipi e intensità crescono col tempo e col livello ---------- */
  updateWaves(dt) {
    if (this.st === 'intro') {
      this.introT -= dt;
      if (this.introT <= 0) { this.st = 'run'; this.clearLevelPanel(); }
      return;
    }
    if (this.st !== 'run' && this.st !== 'boss') return;
    const lv = this.lv;
    const T = this.time;
    if (this.st === 'run') {
      this.spwn.t += dt;
      const mg = 1 + lv * 0.42;
      let interval = 1.9;
      if (T > 20) interval = 1.25;
      if (T > 45) interval = 0.95;
      if (T > 70) interval = 0.72;
      if (T > 95) interval = 0.55;
      interval /= (1 + this.w.combo * 0.35);
      if (this.spwn.t >= interval) {
        this.spwn.t = 0; this.spwn.wave++;
        const n = Math.ceil(1.4 + Math.min(6, lv * 0.55)) + (this.spwn.wave % 5 === 0 ? 3 : 0);
        for (let k = 0; k < n; k++) this.spawnEnemy(lv, T, mg);
      }
    }
    if (this.st === 'boss') {
      this.spwn.t += dt;
      if (this.spwn.t >= 2.2) {
        this.spwn.t = 0;
        const n = 1 + Math.floor(lv * 0.3);
        for (let k = 0; k < n; k++) this.spawnEnemy(lv, T, 0.5 + lv * 0.2);
      }
    }
    /* boss timer */
    if (this.st === 'run' && this.time >= BOSS_TIME_SEC) {
      this.spawnBoss();
    }
  }

  spawnEnemy(lv, T, mult) {
    const types = lv < 1 ? ['atomo'] : lv < 2 ? ['atomo', 'atomo2'] :
      lv < 3 ? ['atomo', 'atomo2', 'batterio'] :
      lv < 4 ? ['atomo2', 'batterio', 'tossina'] :
      lv < 5 ? ['batterio', 'tossina', 'virus'] :
      lv < 6 ? ['tossina', 'virus', 'ione'] :
      lv < 7 ? ['virus', 'ione', 'prione'] :
      lv < 8 ? ['ione', 'prione', 'muto'] :
      lv < 9 ? ['prione', 'muto', 'scoria'] : ['muto', 'scoria', 'bio'];
    const k = pick(types);
    const t = ENEMY_BY_KEY[k];
    const ang = rnd(0, 6.283);
    const r = Math.max(this.res.W, this.res.H);
    const px = this.pl.x + Math.cos(ang) * r * 0.75;
    const py = this.pl.y + Math.sin(ang) * r * 0.75;
    const sp = t.sp * rnd(0.85, 1.18) * (1 + lv * 0.08 + Math.min(0.4, T / 160));
    const hp = t.hp * (1 + lv * 0.35) * (0.8 + mult * 0.28) * (1 + Math.min(0.6, T / 140));
    this.addEnemy(t, px, py, sp, hp, mult);
  }
/* ---------- nemici: costruzione vettoriale per tipo ---------- */
  addEnemy(t, x, y, sp, hp, mult) {
    const s = { r: t.r, col: t.col, col2: t.col2 };
    const shp = { body: null, a1: null, a2: null, a3: null, core: null, rot: 0 };
    const col = t.col, col2 = t.col2, r = t.r;
    shp.body = cs(this.gEnemies, x, y, r, col);
    if (t.k === 'atomo' || t.k === 'atomo2') {
      shp.core = cs(this.gEnemies, x, y, r * 0.45, col2);
      shp.a1 = cs(this.gEnemies, x + r * 0.8, y, r * 0.3, col2);
      shp.rot = rnd(0, 6.28);
    } else if (t.k === 'batterio') {
      shp.body = es(this.gEnemies, x, y, r * 1.05, r * 0.78, col);
      shp.a1 = cs(this.gEnemies, x - r * 0.7, y, r * 0.2, col2);
      shp.a2 = cs(this.gEnemies, x - r * 0.9, y, r * 0.15, col2);
    } else if (t.k === 'tossina') {
      shp.core = cs(this.gEnemies, x, y, r * 0.6, col2);
      shp.a1 = cs(this.gEnemies, x, y - r * 0.9, r * 0.5, col);
    } else if (t.k === 'virus') {
      shp.body = mks(this.gEnemies, x, y, r, 6, col);
      shp.core = cs(this.gEnemies, x, y, r * 0.5, col2);
      shp.a1 = cs(this.gEnemies, x, y, r * 1.25, 0x000000);
      shp.a2 = cs(this.gEnemies, x, y, r * 1.5, col); shp.a2.setAlpha(0.35);
      shp.rot = rnd(0, 6.28);
    } else if (t.k === 'ione') {
      shp.core = cs(this.gEnemies, x, y, r * 0.55, col2);
      shp.a1 = cs(this.gEnemies, x + r * 0.7, y, r * 0.22, col);
      shp.a2 = cs(this.gEnemies, x - r * 0.7, y, r * 0.22, col);
      shp.a3 = cs(this.gEnemies, x, y - r * 0.7, r * 0.22, col);
    } else if (t.k === 'prione') {
      shp.body = es(this.gEnemies, x, y, r, r * 0.72, col);
      shp.a1 = cs(this.gEnemies, x - r * 0.8, y - r * 0.4, r * 0.3, col2);
      shp.a2 = cs(this.gEnemies, x + r * 0.8, y + r * 0.3, r * 0.3, col2);
      shp.rot = rnd(0, 6.28);
    } else if (t.k === 'muto') {
      shp.body = mks(this.gEnemies, x, y, r, 8, col);
      shp.core = cs(this.gEnemies, x, y, r * 0.55, col2);
      shp.rot = rnd(0, 6.28);
    } else if (t.k === 'scoria') {
      shp.body = cs(this.gEnemies, x, y, r * 1.1, col);
      shp.a1 = mks(this.gEnemies, x, y, r * 0.6, 4, col2);
      shp.rot = rnd(0, 6.28);
    } else {
      shp.body = cs(this.gEnemies, x, y, r, col);
      shp.a1 = mks(this.gEnemies, x - r, y, r * 0.4, 3, col2);
      shp.a2 = mks(this.gEnemies, x + r, y, r * 0.4, 3, col2);
      shp.a3 = mks(this.gEnemies, x, y + r, r * 0.4, 3, col2);
      shp.rot = rnd(0, 6.28);
    }
    if (shp.body && shp.body.setDepth) shp.body.setDepth(50);
    const e = {
      t, x, y, sp, hp, maxHp: hp, s, shp, r,
      flash: 0, ttl: 60, hit: 0, mult,
      ox: x, oy: y, wob: rnd(0, 6.28), state: 'chase', aim: rnd(0, 6.28),
    };
    this.enemies.push(e);
    if (this.enemies.length > 240) {
      const dead = this.enemies.shift();
      if (dead && dead.shp) this.destroyShapes(dead.shp);
    }
    return e;
  }

  destroyShapes(s) {
    const kids = s && (Array.isArray(s) ? s : Object.values(s));
    if (!kids) return;
    kids.forEach(k => { if (k && k.destroy) { try { k.destroy(); } catch (e) { } } });
  }

  /* ---------- aggiornamento nemici, collisioni col giocatore ---------- */
  updateEnemies(dt) {
    const pl = this.pl, e = this.enemies, dl = new Array();
    const px = pl.x, py = pl.y;
    for (let i = 0; i < e.length; i++) {
      const m = e[i];
      if (m.flash > 0) m.flash -= dt;
      m.wob += dt * 3;
      /* perseguono il giocatore con un po' di onda */
      const ang = Math.atan2(py - m.y, px - m.x);
      let sp = m.sp;
      m.aim += (ang - m.aim) * Math.min(1, dt * 2.2);
      const w = m.wob;
      m.x += Math.cos(m.aim) * sp * dt + Math.sin(w) * 14 * dt;
      m.y += Math.sin(m.aim) * sp * dt + Math.cos(w * 0.9) * 14 * dt;
      m.ttl -= dt;
      if (m.x < -80) m.x += AREA.W + 160; if (m.x > AREA.W + 80) m.x -= AREA.W + 160;
      if (m.y < -80) m.y += AREA.H + 160; if (m.y > AREA.H + 80) m.y -= AREA.H + 160;

      /* posiziona le forme */
      if (m.shp.body) m.shp.body.setPosition(m.x, m.y);
      if (m.shp.core) m.shp.core.setPosition(m.x, m.y);
      if (m.shp.a1) {
        m.shp.rot += dt * 2.4;
        if (m.t.k === 'atomo' || m.t.k === 'atomo2') {
          m.shp.a1.setPosition(m.x + Math.cos(m.shp.rot) * m.r * 0.85, m.y + Math.sin(m.shp.rot) * m.r * 0.85);
        } else if (m.t.k === 'tossina') {
          m.shp.a1.setPosition(m.x, m.y - m.r * 0.9);
        } else if (m.t.k === 'virus') {
          m.shp.a1.setPosition(m.x, m.y);
        } else {
          m.shp.a1.setPosition(m.x + m.r, m.y);
        }
      }
      if (m.shp.a2 && m.t.k === 'batterio') { m.shp.a2.setPosition(m.x - m.r * 0.9, m.y + Math.sin(m.wob) * 3); }
      if (m.shp.a2 && m.t.k === 'ione') { m.shp.a2.setPosition(m.x - m.r * 0.7, m.y); }
      if (m.shp.a3 && m.t.k === 'ione') { m.shp.a3.setPosition(m.x, m.y - m.r * 0.7); }
      if (m.shp.a2 && m.t.k === 'scoria') { m.shp.a2.setPosition(m.x, m.y); }
      if (m.shp.a1 && m.t.k === 'scoria') { m.shp.a1.setPosition(m.x, m.y); }
      /* riflesso del danno */
      if (m.flash > 0 && m.shp.body) m.shp.body.setFillColor(0xffffff);
      else if (m.shp.body) m.shp.body.setFillColor(m.s.col);

      /* collisione col giocatore */
      if (pl.inv <= 0) {
        const rr = m.r + PLAYER.R;
        if (dist2(m.x, m.y, px, py) < rr * rr) {
          this.hitPlayer(m.t.dmg);
        }
      }
      if (m.ttl <= 0) { dl.push(i); }
    }
    for (let j = dl.length - 1; j >= 0; j--) {
      const i = dl[j];
      const m = e.splice(i, 1)[0];
      this.destroyShapes(m.shp);
    }
  }
/* ---------- aggiornamento giocatore ---------- */
  updatePlayer(dt) {
    const pl = this.pl;
    if (this.st === 'gameover' || this.st === 'victory') return;
    let mx = 0, my = 0;
    const kd = this.keysDown || {};
    if (kd.ArrowLeft || kd.KeyA) mx -= 1;
    if (kd.ArrowRight || kd.KeyD) mx += 1;
    if (kd.ArrowUp || kd.KeyW) my -= 1;
    if (kd.ArrowDown || kd.KeyS) my += 1;
    const jj = this.joystick;
    if (jj.active) { mx += jj.dx; my += jj.dy; }
    const mlen = Math.hypot(mx, my);
    const sp = pl.sp * (1 + this.p.spin * 0.06);
    if (mlen > 1) { mx /= mlen; my /= mlen; }
    pl.vx = mx * sp; pl.vy = my * sp;
    if (pl.dashT > 0) {
      pl.dashT -= dt;
      pl.x += pl.dashDx * dt / 0.21;
      pl.y += pl.dashDy * dt / 0.21;
    } else {
      pl.x += pl.vx * dt;
      pl.y += pl.vy * dt;
    }
    pl.x = clamp(pl.x, 60, AREA.W - 60);
    pl.y = clamp(pl.y, 60, AREA.H - 60);
    if (mlen > 0.2) pl.face = Math.atan2(my, mx);
    if (pl.inv > 0) pl.inv -= dt;
    if (this.dashCd > 0) this.dashCd -= dt;
    this.blink = (this.blink || 0) + dt;

    const s = pl.shape;
    const blinkOn = pl.inv > 0 && Math.sin(this.blink * 30) > 0;
    const al = blinkOn ? 0.35 : 1;
    s.glow.setPosition(pl.x, pl.y); s.glow.setAlpha(0.28 * al);
    s.ring.setPosition(pl.x, pl.y); s.ring.setAlpha((0.5 + 0.2 * Math.sin(this.blink * 6)) * al);
    s.quark.setPosition(pl.x, pl.y); s.quark.setAlpha(al);
    s.quarkD.setPosition(pl.x, pl.y); s.quarkD.setAlpha(al);
    const fa = pl.face;
    s.eye.setPosition(pl.x + Math.cos(fa) * 5, pl.y + Math.sin(fa) * 5 - 2);
    s.pup.setPosition(pl.x + Math.cos(fa) * 8, pl.y + Math.sin(fa) * 8 - 2);
    const a1 = fa + 0.6, a2 = fa - 0.6, a3 = fa + Math.PI;
    s.arm1.setPosition(pl.x + Math.cos(a1) * 30, pl.y + Math.sin(a1) * 30);
    s.arm2.setPosition(pl.x + Math.cos(a2) * 30, pl.y + Math.sin(a2) * 30);
    s.arm3.setPosition(pl.x + Math.cos(a3) * 24, pl.y + Math.sin(a3) * 24);
    s.arm1.setAlpha(al); s.arm2.setAlpha(al); s.arm3.setAlpha(al);
    s.arm1.setRotation(fa + 0.9); s.arm2.setRotation(fa - 0.9); s.arm3.setRotation(fa);
  }

  /* ---------- danno al giocatore ---------- */
  hitPlayer(dmg) {
    if (this.st !== 'run' && this.st !== 'boss') return;
    if (this.pl.inv > 0) return;
    this.hp -= dmg;
    this.pl.inv = 1.0;
    this.boom = Math.max(this.boom, 0.5);
    this.shake = Math.max(this.shake, 12);
    this.floating(this.pl.x, this.pl.y - 34, '-' + Math.ceil(dmg), 0xff5566);
    if (this.hp <= 0) {
      this.hp = 0;
      this.st = 'gameover';
      this.showOver(true);
    }
  }
/* ---------- armi ---------- */
  fireWeapons(dt) {
    if (this.st !== 'run' && this.st !== 'boss') return;
    const flux = (1 + this.p.flux * 0.06);
    if (this.w.laser > 0) {
      this.laserCd = (this.laserCd || 0) - dt * flux;
      if (this.laserCd <= 0) { this.laserCd = 0.5; this.fireLaser(this.w.laser); }
    }
    if (this.w.gluon > 0) {
      this.updateGluonFields(this.w.gluon, dt);
    }
    if (this.w.higgs > 0) {
      this.higgsCd = (this.higgsCd || 0) - dt * flux;
      if (this.higgsCd <= 0) { this.higgsCd = 1.1; this.fireHiggs(this.w.higgs); }
      this.higgsAura(this.w.higgs, dt);
    }
    if (this.w.combo > 0) {
      this.comboCd = (this.comboCd || 0) - dt * flux;
      if (this.comboCd <= 0) { this.comboCd = 0.3; this.fireCombo(); }
    }
  }

  fireLaser(lv) {
    this.aim = this.pl.face;
    const n = Math.min(3, 1 + Math.floor(lv / 2));
    const spread = 0.14;
    for (let i = 0; i < n; i++) {
      const off = (i - (n - 1) / 2) * spread;
      const a = this.aim + off;
      const dmg = 24 * lv * (1 + this.p.glove * 0.06);
      const b = { x: this.pl.x, y: this.pl.y, vx: Math.cos(a), vy: Math.sin(a), dmg, r: 5, pierce: 2 + Math.floor(lv / 2), ttl: 1.0, col: WEAPONS.laser.col, kind: 'laser' };
      this.bullets.push(b);
    }
  }

  fireHiggs(lv) {
    const a = rnd(0, 6.283);
    const dmg = 34 * lv * (1 + this.p.glove * 0.06);
    const b = { x: this.pl.x, y: this.pl.y, vx: Math.cos(a), vy: Math.sin(a), dmg, r: 10, pierce: 4, ttl: 2.4, col: WEAPONS.higgs.col, kind: 'higgs' };
    this.bullets.push(b);
  }

  higgsAura(lv, dt) {
    const pl = this.pl, R = 110 + lv * 22;
    for (let i = 0; i < this.enemies.length; i++) {
      const m = this.enemies[i];
      const dx = m.x - pl.x, dy = m.y - pl.y;
      const d = Math.hypot(dx, dy);
      if (d < R && d > 1) {
        const push = (1 - d / R) * 150 * dt;
        m.x += dx / d * push; m.y += dy / d * push;
      }
    }
    if (!this.auraShp) {
      this.auraShp = mkc(this.gPlayer, pl.x, pl.y, R, WEAPONS.higgs.col);
      if (this.auraShp) this.auraShp.setAlpha(0.12);
    }
    if (this.auraShp) {
      this.auraShp.setPosition(pl.x, pl.y);
      this.auraShp.setScale(1 + Math.sin(this.blink * 8) * 0.05);
    }
  }

  fireCombo() {
    const a = this.pl.face + rnd(-0.12, 0.12);
    const dmg = 95 * (1 + this.p.glove * 0.06);
    const b = { x: this.pl.x, y: this.pl.y, vx: Math.cos(a), vy: Math.sin(a), dmg, r: 13, pierce: 9, ttl: 2.0, col: WEAPONS.combo.col, kind: 'combo' };
    this.bullets.push(b);
  }

  updateGluonFields(lv, dt) {
    const mf = Math.min(3, lv);
    if (!this.fields) this.fields = [];
    while (this.fields.length < mf) {
      this.fields.push({
        x: this.pl.x + rnd(-240, 240), y: this.pl.y + rnd(-240, 240),
        r: 120 + lv * 16, ttl: 6, dmg: 15 * lv * (1 + this.p.glove * 0.06),
        shp: mkc(this.gBullets, 0, 0, 14, WEAPONS.gluon.col),
      });
      const f = this.fields[this.fields.length - 1];
      if (f.shp) { f.shp.setDepth(40); f.shp.setAlpha(0.3); }
    }
  }

  updateFields(dt) {
    const fs = this.fields;
    for (let i = fs.length - 1; i >= 0; i--) {
      const f = fs[i];
      f.ttl -= dt;
      if (f.shp) {
        f.shp.setPosition(f.x, f.y);
        f.shp.setAlpha(Math.min(1, f.ttl / 4) * 0.35);
        f.shp.setScale(1 + Math.sin(this.blink * 5 + i) * 0.2);
      }
      const RR = f.r + 30;
      for (let j = this.enemies.length - 1; j >= 0; j--) {
        const m = this.enemies[j];
        if (dist2(f.x, f.y, m.x, m.y) < RR * RR) {
          this.dmgEnemy(m, f.dmg * dt, f.col || WEAPONS.gluon.col);
        }
      }
      if (f.ttl <= 0) { if (f.shp) this.destroyShapes([f.shp]); fs.splice(i, 1); }
    }
  }

  dmgEnemy(m, dmg, col) {
    if (!m || m.dead) return;
    m.hp -= dmg;
    m.flash = 0.08;
    if (m.hp <= 0) this.killEnemy(m);
  }

  killEnemy(m) {
    if (!m || m.dead) { return; } m.dead = true;
    const idx = this.enemies.indexOf(m);
    if (idx >= 0) this.enemies.splice(idx, 1);
    this.destroyShapes(m.shp);
    this.score += 5 + Math.round(m.t.xp * 3);
    this.kills++;
    this.burst(m.x, m.y, m.t.col, 5);
    if (!this.bossDeadFlood) this.spawnPick(m.x, m.y, m.t.xp);
  }
/* ---------- proiettili e collisioni ---------- */
  updateBullets(dt) {
    this.bt = (this.bt || 0) + dt;
    const bs = this.bullets;
    for (let i = bs.length - 1; i >= 0; i--) {
      const b = bs[i];
      b.x += b.vx * 560 * dt;
      b.y += b.vy * 560 * dt;
      b.ttl -= dt;
      const px = b.x, py = b.y;
      if (!b.shp) {
        if (b.kind === 'laser') {
          b.shp = mkc(this.gBullets, px, py, b.r, b.col);
          if (b.shp) { b.shp.setScale(1, 2.2); b.shp.setAlpha(0.95); }
        } else {
          b.shp = mkc(this.gBullets, px, py, b.r, b.col);
          if (b.shp) { b.shp.setAlpha(0.9); }
        }
        if (b.shp) b.shp.setDepth(45);
        if (b.kind === 'combo') {
          b.glow = mkc(this.gBullets, px, py, b.r * 2, 0x8844cc);
          if (b.glow) { b.glow.setDepth(44); b.glow.setAlpha(0.35); }
        }
      }
      if (b.shp) b.shp.setPosition(px, py);
      if (b.kind === 'laser' && b.shp) b.shp.setScale(1 + Math.sin(this.bt * 40) * 0.3, 2.2);
      if (b.glow) b.glow.setPosition(px, py);
      if (Math.random() < 0.3) this.burst(px, py, b.col, 1, 0.5);
      /* collisioni */
      const rr = b.r + 26;
      if (b.kind === 'laser') {
        const dps = b.dmg * 1.6;
        for (let j = this.enemies.length - 1; j >= 0; j--) {
          const m = this.enemies[j];
          if (dist2(px, py, m.x, m.y) < rr * rr) this.dmgEnemy(m, dps * dt, b.col);
        }
        if (this.boss && dist2(px, py, this.boss.x, this.boss.y) < (this.boss.r + b.r) * (this.boss.r + b.r)) {
          this.dmgBoss(dps * dt, b.col);
        }
      } else {
        for (let j = this.enemies.length - 1; j >= 0; j--) {
          const m = this.enemies[j];
          if (dist2(px, py, m.x, m.y) < rr * rr) {
            this.dmgEnemy(m, b.dmg, b.col);
            b.pierce--;
            if (b.pierce <= 0) break;
          }
        }
        if (b.pierce > 0 && b.kind !== 'gel' && this.boss &&
            dist2(px, py, this.boss.x, this.boss.y) < (this.boss.r + b.r) * (this.boss.r + b.r)) {
          this.dmgBoss(b.dmg, b.col);
          b.pierce--;
          this.burst(px, py, b.col, 4, 1);
        }
      }
      if (b.ttl <= 0 || px < -250 || py < -250 || px > AREA.W + 250 || py > AREA.H + 250 || b.pierce <= 0) {
        if (b.shp) this.destroyShapes([b.shp]);
        if (b.glow) this.destroyShapes([b.glow]);
        bs.splice(i, 1);
      }
    }
  }

  /* ---------- cristalli XP ---------- */
  spawnPick(x, y, xp) {
    if (this.pickups.length > 150) {
      const g = this.pickups.shift();
      if (g && g.shp) this.destroyShapes([g.shp]);
    }
    const col = xp >= 10 ? 0xffb0ff : 0x9be8ff;
    this.pickups.push({ x, y, xp, ttl: 20, shp: mkc(this.gPick, x, y, 6, col), col });
  }

  updatePicks(dt) {
    const pl = this.pl;
    for (let i = this.pickups.length - 1; i >= 0; i--) {
      const p = this.pickups[i];
      p.ttl -= dt;
      const dx = pl.x - p.x, dy = pl.y - p.y;
      const d = Math.hypot(dx, dy);
      const mag = 200 + this.p.anti * 22;
      if (d < mag && d > 1) {
        const sp = (1 - d / mag) * 480 + 60;
        p.x += dx / d * sp * dt;
        p.y += dy / d * sp * dt;
      }
      if (p.shp) {
        p.shp.setPosition(p.x, p.y);
        const sc = 1 + Math.sin(this.bt * 6 + i) * 0.25;
        p.shp.setScale(sc);
        p.shp.setAlpha(Math.min(1, p.ttl / 3));
      }
      if (d < 34) {
        this.addXp(p.xp);
        if (p.shp) this.destroyShapes([p.shp]);
        this.pickups.splice(i, 1);
      } else if (p.ttl <= 0) {
        if (p.shp) this.destroyShapes([p.shp]);
        this.pickups.splice(i, 1);
      }
    }
  }

  addXp(v) {
    this.xp += v * (1 + this.p.anti * 0.08);
    while (this.xp >= this.xpNeed) {
      this.xp -= this.xpNeed;
      this.level++;
      this.xpNeed = Math.round(EXP_BASE * Math.pow(EXP_GROWTH, this.level - 1));
      this.showUpgrade();
    }
  }
/* ---------- scelta upgrade (armi / evoluzioni / passivi) ---------- */
  showUpgrade() {
    if (this.st === 'gameover' || this.st === 'victory') return;
    if (this.st === 'levelup') {
      /* già aperto: riserva */
      if (!this.pend) this.pend = 0;
      this.pend++;
      return;
    }
    /* tutto al massimo? niente pannello: premio direttamente il quark */
    const wepsAvail = Object.keys(WEAPONS).some(k => this.w[k] < WEAPONS[k].max);
    const passAvail = Object.keys(PASSIVES).some(k => this.p[k] < PASSIVES[k].max);
    if (!wepsAvail && !passAvail) {
      this.hp = Math.min(this.maxHp, this.hp + 25);
      this.score += 500;
      this.floating(this.pl.x, this.pl.y - 46, 'TUTTO MAX! +500', 0xffdd66);
      return;
    }
    const prev = this.st;
    this.st = 'levelup';
    this.prevSt = prev;
    this.buildUpgradeOptions();
  }

  buildUpgradeOptions() {
    const W = this.res.W, H = this.res.H;
    if (this.panel) { this.panel.destroy(); this.panel = null; stClear(this); }
    const panel = this.add.container(0, 0);
    this.panel = panel;
    const dim = mkr(panel, 0, 0, W, H, 0x080d1c); dim.setDepth(112);
    const title = this.add.text(W / 2, H * 0.16, 'SALI DI LIVELLO!', { ...TXT, fontSize: 40, color: '#9be8ff', stroke: '#0a1a2a', strokeThickness: 5 });
    title.setOrigin(0.5, 0.5); title.setScrollFactor(0);

    const opts = [];
    /* armi non maxate + passivi non maxati */
    const weps = Object.keys(WEAPONS).filter(k => this.w[k] < WEAPONS[k].max);
    const pass = Object.keys(PASSIVES).filter(k => this.p[k] < PASSIVES[k].max);
    const avail = weps.concat(pass);
    if (avail.length === 0) return opts;
    const wanted = Math.min(3, avail.length);
    const chosen = [];
    const shuffled = shuffle(avail.slice());
    for (let i = 0; i < wanted; i++) chosen.push(shuffled[i]);
    const cx = W / 2;
    for (let i = 0; i < chosen.length; i++) {
      const key = chosen[i];
      const isPass = PASSIVES[key] !== undefined;
      const isCombo = key === 'combo';
      const def = isPass ? PASSIVES[key] : WEAPONS[key];
      const lvl = isPass ? this.p[key] : this.w[key];
      const col = isCombo ? 0xdd77ff : def.col ? def.col : def.ico;
      const px = cx + (i - (chosen.length - 1) / 2) * 340;
      opts.push({ key, def, lvl, isPass, isCombo, px, y: H * 0.5, w: 300, h: 200 });
      const card = mkr(panel, px - 150, H * 0.52 - 100, 300, 200, 0x132a4a);
      if (card) { card.setDepth(113); }
      strokeOn(card, col, 3);
      const ic = mkc(panel, px - 150, H * 0.52 - 40, 30, col);
      const nmTxt = this.add.text(px, H * 0.52 - 8, def.nm, { ...TXT, fontSize: 22, color: isCombo ? '#ff88ff' : '#dff6ff', stroke: '#0a1a2a', strokeThickness: 3 });
      nmTxt.setOrigin(0.5, 0.5); nmTxt.setScrollFactor(0);
      const img2 = this.add.text(px, H * 0.52 + 44, def.img + (isCombo ? '' : (lvl === 0 ? ' — NUOVO!' : ' — Lv ' + lvl + ' → ' + (lvl + 1))), { ...TXT, fontSize: 15, color: '#9be8ff', stroke: '#0a1a2a', strokeThickness: 2 });
      img2.setOrigin(0.5, 0.5); img2.setScrollFactor(0);
    }
    const hint = this.add.text(W / 2, H * 0.78, 'TOCCA una carta per scegliere', { ...TXT, fontSize: 18, color: '#cfeaff', stroke: '#0a1a2a', strokeThickness: 3 });
    hint.setOrigin(0.5, 0.5); hint.setScrollFactor(0);
    this._opts = opts;
    return opts;
  }

  pickUpgradeScreen(x, y) {
    if (this.st !== 'levelup' || !this._opts) return;
    for (let i = 0; i < this._opts.length; i++) {
      const o = this._opts[i];
      if (Math.abs(x - o.px) < 155 && Math.abs(y - o.y) < 110) {
        this.applyUpgrade(o);
        return;
      }
    }
  }

  applyUpgrade(o) {
    const isPass = o.isPass;
    const key = o.key;
    if (isPass) this.p[key] = Math.min(PASSIVES[key].max, (this.p[key] || 0) + 1);
    else this.w[key] = Math.min(WEAPONS[key].max, (this.w[key] || 0) + 1);

    if (key === 'core') this.maxHp += 15;

    /* sirup: singolarità = le 3 armi a livello max, concessa una volta sola */
    if (isComboFull(this) && !this.w.combo) {
      this.w.combo = 1;
      /* ripristina armi a 5 */
      this.w.laser = 5; this.w.gluon = 5; this.w.higgs = 5;
      this.popup('SINGOLARITÀ QUANTISTICA\nLe tre forze unite!');
    }

    if (this.panel) { this.panel.destroy(); this.panel = null; stClear(this); }
    this._opts = null;
    if (this.pend && this.pend > 0) {
      this.pend--;
      this.st = 'levelup';
      this.buildUpgradeOptions();
    } else {
      this.st = this.prevSt;
    }
  }

  /* ---------- utilità pannelli ---------- */
  popup(msg) {
    const W = this.res.W, H = this.res.H;
    if (this._popupPanel) this._popupPanel.destroy();
    const p = this.add.container(0, 0);
    this._popupPanel = p;
    const dim = mkr(p, 0, 0, W, H, 0x05080f); dim.setDepth(114);
    const t = this.add.text(W / 2, H * 0.36, msg, { ...TXT, fontSize: 32, color: '#ff88ff', stroke: '#0a1a2a', strokeThickness: 5, align: 'center' });
    t.setOrigin(0.5, 0.5); t.setScrollFactor(0);
    const t2 = this.add.text(W / 2, H * 0.5, 'TOCCA per continuare', { ...TXT, fontSize: 20, color: '#cfeaff', stroke: '#0a1a2a', strokeThickness: 3 });
    t2.setOrigin(0.5, 0.5); t2.setScrollFactor(0);
    this.input.once('pointerdown', () => {
      if (this._popupPanel) { this._popupPanel.destroy(); this._popupPanel = null; }
    });
  }
/* ---------- helpers di stato ---------- */

/* ============================================================
   SISTEMA BOSS: molecole con attacchi a tema
   ============================================================ */
  spawnBoss() {
    if (this.st !== 'run' || this.boss) return;
    const L = LEVELS[this.lv];
    this.st = 'boss';
    this.spwn.t = 0;
    const x = this.pl.x + rnd(-520, 520), y = this.pl.y + rnd(-380, 380);
    const bx = clamp(x, 260, AREA.W - 260), by = clamp(y, 200, AREA.H - 220);
    const R = 34 * L.scale / 3.4;
    const shp = { body: null, core: null, ring: null, atom1: null, atom2: null, eye1: null, eye2: null, pup1: null, pup2: null };
    shp.body = cs(this.gEnemies, bx, by, R, L.col);
    shp.core = cs(this.gEnemies, bx, by, R * 0.55, L.col2);
    shp.ring = cs(this.gEnemies, bx, by, R * 1.45, L.col); if (shp.ring) shp.ring.setAlpha(0.08);
    shp.atom1 = cs(this.gEnemies, bx, by, R * 0.32, L.col2);
    shp.atom2 = cs(this.gEnemies, bx, by, R * 0.4, L.col2);
    shp.eye1 = mkc(this.gEnemies, bx, by, R * 0.17, 0xffffff);
    shp.eye2 = mkc(this.gEnemies, bx, by, R * 0.17, 0xffffff);
    shp.pup1 = mkc(this.gEnemies, bx, by, R * 0.09, 0x1a1a2a);
    shp.pup2 = mkc(this.gEnemies, bx, by, R * 0.09, 0x1a1a2a);
    this.boss = {
      L, x: bx, y: by, r: R, hp: L.hp * (1 + this.lv * 0.05), maxHp: L.hp * (1 + this.lv * 0.05),
      ang: Math.atan2(this.pl.y - by, this.pl.x - bx), rot: 0, t: 0,
      atkIdx: 0, atkT: 0, state: 'idle', dir: 1, shp, lv: this.lv,
    };
    if (shp.body) { shp.body.setDepth(55); }
    this.burst(bx, by, L.col, 14, 8);
    this.shake = Math.max(this.shake, 10);
    this.boom = Math.max(this.boom, 0.6);
    /* HUD boss */
    this.hud.bossFill.setAlpha(1); this.hud.bossBar.setAlpha(1);
    this.hud.bossName.setText('BOSS ' + this.lv + '/10 — ' + L.name);
    this.hud.bossName.setAlpha(1); this.hud.bossPct.setAlpha(1);
    this.bt = this.bt || 0;
    this.bubble(L.name + '!\n' + pick(BOSS_BUBBLE));
  }

  bubble(msg) {
    const W = this.res.W, H = this.res.H;
    if (this._bubblePanel) this._bubblePanel.destroy();
    const p = this.add.container(0, 0);
    this._bubblePanel = p;
    const box = mkr(p, W / 2 - 250, H * 0.12 - 40, 500, 80, 0x0a1030);
    if (box) box.setDepth(109);
    const t = this.add.text(W / 2, H * 0.12, msg, { ...TXT, fontSize: 20, color: '#ffdd66', stroke: '#0a0a0a', strokeThickness: 3, align: 'center' });
    t.setOrigin(0.5, 0.5); t.setScrollFactor(0);
    this._bubbleT = 3.5;
  }

  dmgBoss(dmg, col) {
    const b = this.boss;
    if (!b) return;
    b.hp -= dmg;
    b.hit = 0.08;
    this.score += Math.round(dmg / 4);
    this.floating(b.x + rnd(-30, 30), b.y - b.r, '-' + Math.round(dmg), col || 0xffffff);
    if (b.hp <= 0) this.killBoss();
  }

  updateBoss(dt) {
    const b = this.boss;
    if (!b) return;
    b.t += dt; b.rot += dt * 1.4;
    if (b.hit > 0) b.hit -= dt;
    const dxSpace = this.pl.x - b.x, dySpace = this.pl.y - b.y;
    const dpSpace = Math.hypot(dxSpace, dySpace);
    /* movimenti: follow del giocatore, ma durante un dash carica diritto */
    if (b.dashV && b.dashV.t > 0) {
      b.dashV.t -= dt;
      b.x += b.dashV.x * dt; b.y += b.dashV.y * dt;
      const rr = b.r + PLAYER.R;
      if (this.pl.inv <= 0 && dist2(b.x, b.y, this.pl.x, this.pl.y) < rr * rr) {
        this.hitPlayer(b.dashV.dmg);
        b.dashV.t = 0;
        this.burst(b.x, b.y, b.L.col2, 8, 3);
      }
    } else {
      const vx = dxSpace / dpSpace, vy = dySpace / dpSpace;
      const sp = b.L.speed * (0.85 + Math.sin(b.t * 1.8) * 0.3);
      if (dpSpace > 320) { b.x += vx * sp * dt; b.y += vy * sp * dt; }
      else if (dpSpace < 180) { b.x -= vx * sp * dt; b.y -= vy * sp * dt; }
    }
    b.x = clamp(b.x, 120, AREA.W - 120); b.y = clamp(b.y, 110, AREA.H - 110);

    /* occhi che guardano il giocatore */
    const eyeOff = 0.42;
    if (b.shp.eye1) {
      const ex = Math.cos(b.rot + eyeOff), ey = Math.sin(b.rot + eyeOff);
      b.shp.eye1.setPosition(b.x + ex * b.r * 0.55, b.y + ey * b.r * 0.55);
      b.shp.eye2.setPosition(b.x - ex * b.r * 0.55, b.y - ey * b.r * 0.55);
    }
    if (b.shp.pup1) {
      const lp = Math.atan2(dySpace, dxSpace);
      b.shp.pup1.setPosition(b.shp.eye1.x + Math.cos(lp) * 5, b.shp.eye1.y + Math.sin(lp) * 5);
      b.shp.pup2.setPosition(b.shp.eye2.x + Math.cos(lp) * 5, b.shp.eye2.y + Math.sin(lp) * 5);
    }
    /* atomi rotanti a tema */
    if (b.shp.atom1) b.shp.atom1.setPosition(b.x + Math.cos(b.rot * 1.2 + 0.4) * b.r * 1.9, b.y + Math.sin(b.rot * 1.2 + 0.4) * b.r * 1.9);
    if (b.shp.atom2) b.shp.atom2.setPosition(b.x + Math.cos(b.rot * 1.2 + 2.2) * b.r * 2.3, b.y + Math.sin(b.rot * 1.2 + 2.2) * b.r * 2.3);
    if (b.shp.body) b.shp.body.setPosition(b.x, b.y);
    if (b.shp.core) b.shp.core.setPosition(b.x, b.y);
    if (b.shp.ring) b.shp.ring.setPosition(b.x, b.y);
    if (b.shp.body) {
      if (b.hit > 0) b.shp.body.setFillColor(0xffffff);
      else b.shp.body.setFillColor(b.L.col);
    }

    /* pattern di attacco */
    b.atkT -= dt;
    if (b.atkT <= 0) {
      const atk = b.L.atoms[b.atkIdx % b.L.atoms.length];
      b.atkIdx++;
      b.atkT = atk.cd;
      this.bossAttack(b, atk);
    }

    /* collisione col giocatore */
    if (this.pl.inv <= 0) {
      const rr = b.r + PLAYER.R;
      if (dist2(b.x, b.y, this.pl.x, this.pl.y) < rr * rr) {
        this.hitPlayer(26 + this.lv * 2);
      }
    }

    /* barra HUD */
    const pct = clamp(b.hp / b.maxHp, 0, 1);
    if (this.hud.bossFill) {
      this.hud.bossFill.setScale(pct, 1);
      this.hud.bossFill.setAlpha(1);
    }
    if (this.hud.bossPct) this.hud.bossPct.setText(Math.ceil(pct * 100) + '%');
  }
bossAttack(b, atk) {
    const n = atk.cnt || atk.n || 1;
    const base = Math.atan2(this.pl.y - b.y, this.pl.x - b.x);
    const spd = atk.speed || 180;
    const dmg = atk.dmg || 12;
    const col = b.L.col2;
    switch (atk.p) {
      case 'aim':
        for (let i = 0; i < n; i++) {
          const a = base + rnd(-0.16, 0.16) * (atk.spread || 0.2);
          this.bossBullets.push({ x: b.x, y: b.y, vx: Math.cos(a), vy: Math.sin(a), r: 7, ttl: 6, dmg, col, spd });
        }
        this.burst(b.x, b.y, col, 4, 2);
        break;
      case 'ring': {
        const cnt = atk.cnt || atk.n || 10;
        for (let k = 0; k < cnt; k++) {
          const a = rnd(0, 6.283);
          this.bossBullets.push({ x: b.x, y: b.y, vx: Math.cos(a), vy: Math.sin(a), r: 6, ttl: 9, dmg, col, spd });
        }
        break;
      }
      case 'radial': {
        const cnt = atk.cnt || atk.n || 16;
        for (let k = 0; k < cnt; k++) {
          const a = (k / cnt) * 6.283;
          this.bossBullets.push({ x: b.x, y: b.y, vx: Math.cos(a), vy: Math.sin(a), r: 7, ttl: 7, dmg, col, spd });
        }
        break;
      }
      case 'spiral': {
        const cnt = atk.cnt || atk.n || 6;
        const s0 = b.rot * 2.1;
        for (let k = 0; k < cnt; k++) {
          const a = s0 + k * 0.9;
          this.bossBullets.push({ x: b.x, y: b.y, vx: Math.cos(a), vy: Math.sin(a), r: 6, ttl: 5, dmg, col, spd });
        }
        break;
      }
      case 'orbit':
        for (let k = 0; k < n; k++) {
          const a = b.rot + (k / n) * 6.283;
          this.orbits = this.orbits || [];
          this.orbits.push({ x: b.x, y: b.y, a, vr: b.r + 46, spd: 1.5, ttl: 4, r: 12, dmg, col });
        }
        break;
      case 'bubble': {
        const bb = { x: b.x, y: b.y, vx: 0, vy: 0, r: 22, ttl: 5.5, dmg, col, kind: 'bubble', tr: 0 };
        this.bossBullets.push(bb);
        break;
      }
      case 'spawn': {
        const types = [ENEMY_BY_KEY['atomo2'], ENEMY_BY_KEY['batterio'], ENEMY_BY_KEY['virus']];
        for (let k = 0; k < (atk.count || 4); k++) {
          const t = pick(types);
          const a = rnd(0, 6.283);
          this.addEnemy(t, b.x + Math.cos(a) * b.r * 1.6, b.y + Math.sin(a) * b.r * 1.6,
            t.sp * (1 + atk.mod * 0.3), t.hp * (1 + atk.mod * 0.5), 1);
        }
        this.burst(b.x, b.y, col, 8, 3);
        break;
      }
      case 'dash': {
        const da = b.dir * -1; b.dir = da;
        const sp = atk.speed || 640;
        b.dashV = { x: Math.cos(base) * sp, y: Math.sin(base) * sp, t: 0.55, dmg };
        break;
      }
      default:
        break;
    }
  }

  updateBossBullets(dt) {
    /* proiettili */
    for (let i = this.bossBullets.length - 1; i >= 0; i--) {
      const p = this.bossBullets[i];
      const spd = p.spd || 220;
      if (p.kind === 'bubble') {
        /* la bolla cresce e rallenta, poi esplode */
        p.tr += dt;
        p.r = 22 + p.tr * 70;
        p.vx *= (1 - dt * 1.2); p.vy *= (1 - dt * 1.2);
      }
      p.x += p.vx * spd * dt;
      p.y += p.vy * spd * dt;
      if (!p.shp) {
        p.shp = mkc(this.gBullets, p.x, p.y, p.r, p.col);
        if (p.shp) p.shp.setDepth(48);
      }
      if (p.shp) {
        p.shp.setPosition(p.x, p.y);
        if (p.kind === 'bubble') { p.shp.setScale(1 + p.tr * 1.2); p.shp.setAlpha(0.5); }
        else p.shp.setAlpha(0.9 + Math.sin(this.bt * 10) * 0.1);
      }
      p.ttl -= dt;
      if (p.x < -80 || p.y < -80 || p.x > AREA.W + 80 || p.y > AREA.H + 80 || p.ttl <= 0) {
        if (p.kind === 'bubble') { /* esplode */
          this.burst(p.x, p.y, p.col, 10, 4);
          for (let k = 0; k < 8; k++) {
            const a = (k / 8) * 6.283;
            this.bossBullets.push({ x: p.x, y: p.y, vx: Math.cos(a), vy: Math.sin(a), r: 5, ttl: 2, dmg: 10, col: p.col, spd: 80 });
          }
        }
        if (p.shp) this.destroyShapes([p.shp]);
        this.bossBullets.splice(i, 1);
        continue;
      }
      if (this.st === 'run' || this.st === 'boss') {
        const rr = p.r + PLAYER.R;
        if (this.pl.inv <= 0 && dist2(p.x, p.y, this.pl.x, this.pl.y) < rr * rr) {
          this.hitPlayer(p.dmg);
          this.burst(p.x, p.y, p.col, 6, 2);
          this.bossBullets.splice(i, 1);
        }
      }
    }
    /* orbite */
    if (this.orbits) {
      for (let i = this.orbits.length - 1; i >= 0; i--) {
        const o = this.orbits[i];
        o.a += o.spd * dt; o.ttl -= dt;
        o.x = this.boss ? this.boss.x : o.x;
        o.y = this.boss ? this.boss.y : o.y;
        o.px = o.x + Math.cos(o.a) * o.vr;
        o.py = o.y + Math.sin(o.a) * o.vr;
        if (!o.shp) {
          o.shp = mkc(this.gBullets, o.px, o.py, o.r, o.col);
          if (o.shp) o.shp.setDepth(48);
        }
        if (o.shp) { o.shp.setPosition(o.px, o.py); o.shp.setAlpha(0.85); }
        if (o.ttl <= 0) { if (o.shp) this.destroyShapes([o.shp]); this.orbits.splice(i, 1); continue; }
        const rr = o.r + PLAYER.R;
        if (this.pl.inv <= 0 && dist2(o.px, o.py, this.pl.x, this.pl.y) < rr * rr) {
          this.hitPlayer(o.dmg);
          if (o.shp) this.destroyShapes([o.shp]);
          this.orbits.splice(i, 1);
        }
      }
    }
  }

  killBoss() {
    const b = this.boss;
    if (!b || b.dead) return;
    b.dead = true;
    this.destroyShapes(b.shp);
    this.burst(b.x, b.y, b.L.col, 30, 10);
    this.burst(b.x, b.y, 0xffffff, 20, 6);
    this.shake = Math.max(this.shake, 18);
    this.boom = Math.max(this.boom, 1);
    this.score += 500 + b.L.hp / 20;
    const endBoss = this.lv >= LEVELS.length - 1;
    this.boss = null;
    /* mega candela XP */
    this.spawnPick(b.x, b.y, 55);
    if (this.hud.bossFill) this.hud.bossFill.setAlpha(0);
    if (this.hud.bossBar) this.hud.bossBar.setAlpha(0);
    if (this.hud.bossName) this.hud.bossName.setAlpha(0);
    if (this.hud.bossPct) this.hud.bossPct.setAlpha(0);
    if (endBoss) {
      this.st = 'victory';
      this.showOver(false);
    } else {
      this.bossDeadFlood = 1;
      this.st = 'clear';
      this.clearT = 2.2;
      this.floating(b.x, b.y - 40, 'BOSS SCONFITTO!', b.L.col2);
      if (this._bubblePanel) { this._bubblePanel.destroy(); this._bubblePanel = null; }
    }
  }
/* ---------- effetti: particelle, flash, shake ---------- */
  burst(x, y, col, n, sp) {
    const max = 60;
    for (let k = 0; k < n && this.parts.length < max * 4; k++) {
      const a = rnd(0, 6.283), v = rnd(30, 260) * (sp || 1);
      const p = { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, ttl: rnd(0.3, 0.8), col, shp: null };
      p.shp = mkc(this.gPfx, x, y, rnd(2.5, 6), col);
      if (p.shp) { p.shp.setDepth(85); p.shp.setAlpha(0.9); }
      this.parts.push(p);
    }
    while (this.parts.length > max * 4) { const z = this.parts.shift(); if (z && z.shp) this.destroyShapes([z.shp]); }
  }

  floating(x, y, msg, col) {
    const t = this.add.text(x, y, msg, { ...TXT, fontSize: 15, color: '#' + this.hex(col), stroke: '#0a0a2a', strokeThickness: 3 });
    t.setOrigin(0.5, 0.5);
    this.texts.push({ x, y, t, ttl: 0.9, vy: -70, col });
  }

  hex(c) { let s = c.toString(16); while (s.length < 6) s = '0' + s; return s; }

  updateFx(dt) {
    /* particelle */
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.ttl -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.94; p.vy *= 0.94;
      if (p.shp) { p.shp.setPosition(p.x, p.y); p.shp.setAlpha(Math.max(0, p.ttl * 1.2)); }
      if (p.ttl <= 0) { if (p.shp) this.destroyShapes([p.shp]); this.parts.splice(i, 1); }
    }
    /* testi fluttuanti */
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const f = this.texts[i];
      f.ttl -= dt; f.y += f.vy * dt; f.vy *= 0.92;
      f.t.setPosition(f.x, f.y);
      f.t.setAlpha(Math.min(1, f.ttl * 2));
      if (f.ttl <= 0) { f.t.destroy(); this.texts.splice(i, 1); }
    }
    if (this.shake > 0) this.shake *= (1 - dt * 3.2);
    if (this.boom > 0) this.boom = Math.max(0, this.boom - dt * 2.2);
    /* flash schermo */
    if (this.boom > 0.01) {
      if (!this.flashShp) {
        this.flashShp = mkr(this.gHud, 0, 0, RES.W, RES.H, 0xffffff);
        if (this.flashShp) { this.flashShp.setDepth(118); this.flashShp.setAlpha(0); }
      }
      if (this.flashShp) this.flashShp.setAlpha(Math.min(1, this.boom));
    } else if (this.flashShp) this.flashShp.setAlpha(0);
    /* bolla di dialogo boss */
    if (this._bubbleT !== undefined) {
      this._bubbleT = (this._bubbleT || 0) - dt;
      if (this._bubbleT <= 0 && this._bubblePanel) { this._bubblePanel.destroy(); this._bubblePanel = null; }
    }
  }
/* ---------- ciclo principale ---------- */
  update(time, delta) {
    const dt = Math.min(0.033, delta / 1000 || 0.016);
    if (this.st === 'title') {
      this.updateFx(dt);
      return;
    }
    if (this.st === 'gameover' || this.st === 'victory') {
      this.updateFx(dt);
      this.updateCam(dt);
      return;
    }
    if (this.paused) { this.updateFx(dt); return; }

    if (this.st !== 'levelup' && this.st !== 'clear') {
      this.time += dt;
      this.updateWaves(dt);
      this.updatePlayer(dt);
      this.updateEnemies(dt);
      this.fireWeapons(dt);
      this.updateBullets(dt);
      this.updateFields(dt);
      this.updateBoss(dt);
      this.updateBossBullets(dt);
      this.updatePicks(dt);
      this.updateFx(dt);   /* particelle, shake, flash */
    } else if (this.st === 'clear') {
      this.updateFx(dt);
      this.clearT -= dt;
      if (this.clearT <= 0) {
        /* livello successivo */
        const nxt = this.lv + 1;
        if (nxt >= LEVELS.length) {
          this.st = 'victory';
          this.showOver(false);
          return;
        }
        this.startLevel(nxt);
      }
    } else if (this.st === 'levelup') {
      this.updateFx(dt);
    }
    this.updateHud(dt);
    this.updateCam(dt);
  }

  updateCam(dt) {
    if (this.st === 'run' || this.st === 'boss' || this.st === 'levelup') {
      const tx = this.pl.x, ty = this.pl.y;
      this.cam.x += (tx - this.cam.x) * Math.min(1, dt * 6);
      this.cam.y += (ty - this.cam.y) * Math.min(1, dt * 6);
    }
    const shx = (Math.random() - 0.5) * this.shake;
    const shy = (Math.random() - 0.5) * this.shake;
    try {
      if (this.camera && this.camera.centerOn) this.camera.centerOn(this.cam.x + shx, this.cam.y + shy);
      else if (this.camera && this.camera.setCenter) this.camera.setCenter(this.cam.x + shx, this.cam.y + shy);
    } catch (e) { }
  }

  /* ---------- HUD ---------- */
  updateHud(dt) {
    const W = this.res.W, H = this.res.H;
    const mins = Math.floor(this.time / 60), secs = Math.floor(this.time % 60);
    const ts = mins + ':' + (secs < 10 ? '0' : '') + secs;
    this.hud.timer.setText(ts);

    const hpPct = clamp(this.hp / this.maxHp, 0, 1);
    this.hud.hp.setScale(hpPct, 1);
    this.hud.hpT.setText(Math.ceil(this.hp) + '/' + Math.ceil(this.maxHp));

    const xpPct = clamp(this.xp / this.xpNeed, 0, 1);
    this.hud.xp.setScale(xpPct, 1);

    this.hud.lvl.setText('LIVELLO ' + (this.lv + 1) + ' · Lv ' + this.level);
    this.hud.score.setText('' + Math.floor(this.score));

    /* armi nella HUD */
    const wp = [];
    if (this.w.laser > 0) wp.push('Laser Lv' + this.w.laser);
    if (this.w.gluon > 0) wp.push('Gluoni Lv' + this.w.gluon);
    if (this.w.higgs > 0) wp.push('Higgs Lv' + this.w.higgs);
    if (this.w.combo > 0) wp.push('★ Singolarità');
    if (wp.length === 0) wp.push('Nessuna arma — raccogli XP!');
    this.hud.wt.forEach((x, i) => {
      x.tag.setText((wp[i] || '') + (i === 0 ? '  [SPACE Dash]' : ''));
    });
    if (this.w.combo > 0) this.hud.comboT.setText('★ SINGOLARITÀ ATTIVA');
    else this.hud.comboT.setText('');
  }

  /* ---------- reset / replay / fine partita ---------- */
  reset() {
    this.lv = 0; this.time = 0; this.score = 0; this.kills = 0;
    this.hp = PLAYER.HP; this.maxHp = PLAYER.HP;
    this.xp = 0; this.xpNeed = EXP_BASE; this.level = 1;
    this.w = { laser: 0, gluon: 0, higgs: 0, combo: 0 };
    this.p = { glove: 0, core: 0, spin: 0, flux: 0, anti: 0 };
    this.enemies = []; this.bullets = []; this.fields = [];
    this.pickups = []; this.parts = []; this.texts = [];
    this.boss = null; this.bossBullets = []; this.orbits = []; this.bossSpawns = [];
    this.dashCd = 0; this.bossDeadFlood = 0;
    this.pend = 0;
    /* distruggi le forme residue della partita precedente (anti-ghost) */
    const wipe = (arr, fn) => { if (Array.isArray(arr)) arr.forEach(fn); };
    wipe(this.enemies, m => this.destroyShapes(m.shp));
    wipe(this.bullets, b => { if (b.shp) this.destroyShapes([b.shp]); if (b.glow) this.destroyShapes([b.glow]); });
    wipe(this.fields, f => { if (f.shp) this.destroyShapes([f.shp]); });
    wipe(this.pickups, p => { if (p.shp) this.destroyShapes([p.shp]); });
    wipe(this.parts, p => { if (p.shp) this.destroyShapes([p.shp]); });
    wipe(this.bossBullets, p => { if (p.shp) this.destroyShapes([p.shp]); });
    wipe(this.orbits, o => { if (o.shp) this.destroyShapes([o.shp]); });
    wipe(this.bossSpawns, s => { if (s.shp) this.destroyShapes([s.shp]); });
    wipe(this.texts, t => { if (t && t.shp) this.destroyShapes([t.shp]); else if (t && t.txt && t.txt.destroy) { try { t.txt.destroy(); } catch (e) { } } });
    if (this.boss && this.boss.shp) this.destroyShapes(this.boss.shp);
    this.clearLevelPanel();
    this.resetShapes();
    this.createPlayer();
    this.startLevel(0);
  }

  resetShapes() {
    const gs = [this.gWaves, this.gBullets, this.gEnemies, this.gPick, this.gPfx, this.gPlayer];
    gs.forEach(g => { if (g) g.destroy(); });
    this.gWaves = this.add.container(0, 0);
    this.gBullets = this.add.container(0, 0);
    this.gEnemies = this.add.container(0, 0);
    this.gPick = this.add.container(0, 0);
    this.gPfx = this.add.container(0, 0);
    this.gPlayer = this.add.container(0, 0);
  }

  replay() {
    this.reset();
  }

  showOver(dead) {
    const W = this.res.W, H = this.res.H;
    if (this._overPanel) { this._overPanel.destroy(); }
    const p = this.add.container(0, 0);
    this._overPanel = p;
    const dim = mkr(p, 0, 0, W, H, dead ? 0x1a0a2a : 0x0b1a33);
    if (dim) dim.setDepth(116);
    const title = dead ? 'GAME OVER' : 'VITTORIA!';
    const col = dead ? '#ff5566' : '#ffdd88';
    const t = this.add.text(W / 2, H * 0.32, title, { ...TXT, fontSize: 74, color: col, stroke: '#0a1a2a', strokeThickness: 6, align: 'center' });
    t.setOrigin(0.5, 0.5); t.setScrollFactor(0);
    const msg = dead ? ('Quark è stato dissolto nel regno microscopico.\nIl livello raggiunto: ' + (this.lv + 1) + ' di 10.')
      : ('Hai liberato tutti i 10 boss e Quark è fuggito!\n' + pick(FLAVOR_SOLE) + ' ti attende.');
    const m = this.add.text(W / 2, H * 0.5, msg, { ...TXT, fontSize: 24, stroke: '#0a1a2a', strokeThickness: 4, align: 'center' });
    m.setOrigin(0.5, 0.5); m.setScrollFactor(0);
    const st = this.add.text(W / 2, H * 0.65,
      'Punteggio: ' + Math.floor(this.score) + ' · Nemici sconfitti: ' + this.kills + ' · Armi: ' +
      Object.values(this.w).reduce((a, b) => a + b, 0),
      { ...TXT, fontSize: 20, color: '#9be8ff', stroke: '#0a1a2a', strokeThickness: 3, align: 'center' });
    st.setOrigin(0.5, 0.5); st.setScrollFactor(0);
    const r = this.add.text(W / 2, H * 0.78, 'TOCCA o premi INVIO per rigiocare', { ...TXT, fontSize: 26, color: '#cfeaff', stroke: '#0a1a2a', strokeThickness: 4, align: 'center' });
    r.setOrigin(0.5, 0.5); r.setScrollFactor(0);
  }

  // compatibilità Phaser <3.60: scene possono avere questo metodo
  shutdown() {}
}
const config = {
  type: Phaser.AUTO,
  width: RES.W,
  height: RES.H,
  parent: 'game',
  backgroundColor: '#0a1c3a',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  autoFocus: true,
  render: { antialias: true },
  scene: [Game],
};
const game = new Phaser.Game(config);
game.scene.start('Game');
}
</script>
</body>
</html>
