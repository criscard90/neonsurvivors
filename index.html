<!DOCTYPE html>
<html lang="it">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<meta name="theme-color" content="#02070e">
	<meta name="description" content="Quark: sopravvivi alle ondate molecolari e fuggi dal regno microscopico.">
	<link rel="manifest" href="manifest.json">
	<title>QUARK // Escape from the Microworld</title>
	<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap');
		:root { --ink:#dffaff; --cyan:#39f6ff; --pink:#ff4d9d; --lime:#c7ff52; --panel:#07131e; }
		* { box-sizing:border-box; }
		html,body { margin:0; min-height:100%; background:#02070e; color:var(--ink); font-family:'Barlow Condensed',sans-serif; overflow:hidden; }
		body:before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.25; background:linear-gradient(rgba(57,246,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(57,246,255,.035) 1px,transparent 1px); background-size:34px 34px; }
		#game { width:100vw; height:100vh; display:grid; place-items:center; }
		canvas { display:block; box-shadow:0 0 70px rgba(0,214,255,.13); }
		#loading { position:fixed; inset:0; display:grid; place-items:center; background:#02070e; letter-spacing:.12em; font-family:'Space Mono',monospace; font-size:12px; color:var(--cyan); }
		.hidden { display:none !important; }
		#shareButton { position:fixed; right:14px; bottom:14px; z-index:40; border:1px solid var(--cyan); background:#07131e; color:var(--cyan); padding:7px 10px; font:700 9px 'Space Mono',monospace; letter-spacing:.06em; cursor:pointer; }
		#shareButton:hover { background:#0b202b; }
		.shareIcon { position:relative; display:block; width:16px; height:16px; }
		.shareIcon:before, .shareIcon:after { content:""; position:absolute; left:4px; width:9px; height:1px; background:currentColor; transform-origin:left center; }
		.shareIcon:before { top:6px; transform:rotate(-29deg); }
		.shareIcon:after { top:10px; transform:rotate(29deg); }
		.shareIcon i { position:absolute; width:5px; height:5px; border:1px solid currentColor; border-radius:50%; background:#07131e; }
		.shareIcon i:nth-child(1) { top:5px; left:0; }
		.shareIcon i:nth-child(2) { top:0; right:0; }
		.shareIcon i:nth-child(3) { bottom:0; right:0; }
		#shareOverlay { position:fixed; inset:0; z-index:60; display:grid; place-items:center; background:rgba(2,7,14,.97); cursor:pointer; }
		#shareOverlay img { width:min(72vw, 420px); height:min(72vw, 420px); image-rendering:auto; background:#fff; padding:18px; }
		#closeShare { position:absolute; top:20px; right:20px; border:1px solid var(--pink); background:#07131e; color:var(--pink); padding:10px 14px; font:700 11px 'Space Mono',monospace; cursor:pointer; }
		canvas { touch-action:none; }
	</style>
</head>
<body>
	<div id="game"></div><div id="loading">INITIALIZING QUANTUM FIELD...</div>
	<button id="shareButton" type="button" aria-label="Condividi gioco" title="Condividi gioco"><span class="shareIcon" aria-hidden="true"><i></i><i></i><i></i></span></button>
	<div id="shareOverlay" class="hidden" role="dialog" aria-label="QR code per condividere il gioco">
		<img src="qrcode.png" alt="QR code per condividere il gioco">
		<button id="closeShare" type="button">CLOSE</button>
	</div>
	<script>
	(() => {
		const W = 1100, H = 700, GAME_SECONDS = 120;
		const bosses = [
			['NICOTINA','alkaloid',0xff4d9d], ['CAFFEINA','stimulus',0xffce42], ['ALCOL','solvent',0x58d5ff], ['MERCURIO','metallo',0xb4bfff], ['GLIFOSATO','erbicida',0x9eff4b],
			['BENZENE','aromatico',0xff7552], ['AMIANTO','fibra',0xd5e3ec], ['PLUTONIO','radioattivo',0xb77dff], ['VIRUS X','replicante',0x54ffb4], ['ENTROPIA','finale',0xffffff]
		];
		const weaponInfo = {
			photon:{name:'LASER FOTONICO', color:0x58f6ff, icon:'λ', desc:'raggio coerente'},
			gluon:{name:'CAMPO DI GLUONI', color:0xff4d9d, icon:'✦', desc:'orbite incollanti'},
			higgs:{name:'BOSONE DI HIGGS', color:0xc7ff52, icon:'H', desc:'massa repulsiva'},
			electron:{name:'ELETTRONE ORBITALE', color:0xffce42, icon:'e−', desc:'orbita perforante'},
			neutrino:{name:'NEUTRINO FANTASMA', color:0xb4bfff, icon:'ν', desc:'onda penetrante'},
			antimatter:{name:'ANNICHILATORE', color:0xff7552, icon:'A', desc:'implosione atomica'},
			quarkstorm:{name:'TEMPESTA DI QUARK', color:0x54ffb4, icon:'q', desc:'raffica subatomica'}
		};
		let scene;
		let audioContext;
		const audio = {
			started:false, musicTimer:null, step:0,
			start(){ const Context=window.AudioContext||window.webkitAudioContext; if(!Context)return; if(this.started){if(audioContext.state==='suspended')audioContext.resume();return;} audioContext=new Context(); this.started=true; this.musicTimer=window.setInterval(()=>this.musicStep(),260); this.musicStep(); },
			tone(frequency,duration,type='sine',volume=.035,delay=0){ if(!audioContext)return; const now=audioContext.currentTime+delay,osc=audioContext.createOscillator(),gain=audioContext.createGain(); osc.type=type; osc.frequency.setValueAtTime(frequency,now); gain.gain.setValueAtTime(.0001,now); gain.gain.exponentialRampToValueAtTime(volume,now+.012); gain.gain.exponentialRampToValueAtTime(.0001,now+duration); osc.connect(gain).connect(audioContext.destination); osc.start(now); osc.stop(now+duration+.03); },
			noise(duration=.08,volume=.025){ if(!audioContext)return; const size=Math.floor(audioContext.sampleRate*duration),buffer=audioContext.createBuffer(1,size,audioContext.sampleRate),data=buffer.getChannelData(0); for(let i=0;i<size;i++)data[i]=(Math.random()*2-1)*(1-i/size); const source=audioContext.createBufferSource(),filter=audioContext.createBiquadFilter(),gain=audioContext.createGain(); source.buffer=buffer; filter.type='bandpass'; filter.frequency.value=900; gain.gain.value=volume; source.connect(filter).connect(gain).connect(audioContext.destination); source.start(); },
			musicStep(){ const bass=[55,55,65.41,73.42,55,82.41,73.42,65.41][this.step%8],lead=[220,0,261.63,293.66,0,329.63,293.66,261.63][this.step%8]; this.tone(bass,.22,'triangle',.018); if(lead)this.tone(lead,.12,'sine',.012); this.step++; },
			laser(){this.tone(760,.07,'sawtooth',.025);}, orb(){this.tone(440,.08,'sine',.03);this.tone(660,.12,'sine',.018,.05);}, upgrade(){[392,523.25,783.99].forEach((f,i)=>this.tone(f,.18,'triangle',.035,i*.09));}, boss(){[110,146.83,103.83].forEach((f,i)=>this.tone(f,.3,'sawtooth',.035,i*.12));}, hit(){this.noise(.1,.035);this.tone(90,.12,'square',.018);}, death(){[220,164.81,110].forEach((f,i)=>this.tone(f,.28,'sawtooth',.04,i*.13));}
		};
		const boot = () => { document.getElementById('loading').classList.add('hidden'); };
		const shareButton = document.getElementById('shareButton');
		const shareOverlay = document.getElementById('shareOverlay');
		const closeShare = document.getElementById('closeShare');
		const closeShareOverlay = () => shareOverlay.classList.add('hidden');
		shareButton.addEventListener('click', event => { event.stopPropagation(); shareOverlay.classList.remove('hidden'); });
		closeShare.addEventListener('click', event => { event.stopPropagation(); closeShareOverlay(); });
		shareOverlay.addEventListener('click', event => { if(event.target === shareOverlay) closeShareOverlay(); });
		class Main extends Phaser.Scene {
			constructor(){ super('main'); }
			create(){
				scene=this; this.timeScale=1; this.level=1; this.elapsed=0; this.totalXP=0; this.nextXP=20; this.isGameOver=false; this.boss=null; this.bossPhase=false; this.upgradeOpen=false; this.kills=0;
				this.playerHP=5; this.maxPlayerHP=5;
				this.stats={photon:1,gluon:1,higgs:1,electron:0,neutrino:0,antimatter:0,quarkstorm:0}; this.enemies=[]; this.projectiles=[]; this.xpOrbs=[]; this.particles=[]; this.lastShot={photon:0,gluon:0,higgs:0,electron:0,neutrino:0,antimatter:0,quarkstorm:0};
				this.keys=this.input.keyboard.addKeys('UP,DOWN,LEFT,RIGHT,W,A,S,D'); this.pointer={x:0,y:0,active:false}; this.joystick={active:false,id:null,startX:0,startY:0,x:0,y:0,max:62}; audio.start();
				this.input.on('pointerdown',p=>{if(p.x<W*.58&&p.y>72){this.joystick={active:true,id:p.id,startX:p.x,startY:p.y,x:p.x,y:p.y,max:62};this.pointer.active=true;}});
				this.input.on('pointermove',p=>{if(this.joystick.active&&p.id===this.joystick.id){this.joystick.x=p.x;this.joystick.y=p.y;this.pointer.x=p.x;this.pointer.y=p.y;}});
				this.input.on('pointerup',p=>{if(p.id===this.joystick.id){this.joystick.active=false;this.joystick.id=null;this.pointer.active=false;}});
				this.input.on('pointerupoutside',p=>{if(p.id===this.joystick.id){this.joystick.active=false;this.joystick.id=null;this.pointer.active=false;}});
				this.makeBackground(); this.makePlayer(); this.makeHud(); this.makeTouch();
				this.spawnClock=this.time.addEvent({delay:700,loop:true,callback:()=>this.spawnEnemy()});
				this.physics.add.existing(this.player); this.player.body.setCircle(15, -15, -15); boot();
			}
			makeBackground(){
				const bg=this.add.graphics(); bg.fillStyle(0x030c16,1).fillRect(0,0,W,H); bg.lineStyle(1,0x123444,.32);
				for(let x=0;x<W;x+=44) bg.lineBetween(x,0,x,H); for(let y=0;y<H;y+=44) bg.lineBetween(0,y,W,y);
				for(let i=0;i<55;i++){let x=Phaser.Math.Between(0,W),y=Phaser.Math.Between(0,H),r=Phaser.Math.Between(1,3); bg.fillStyle(i%3?0x39f6ff:0xff4d9d,.3).fillCircle(x,y,r);}
			}
			makePlayer(){ this.player=this.add.container(W/2,H/2); this.player.gfx=this.add.graphics(); this.player.gfx.fillStyle(0x07131e,1).lineStyle(3,0x39f6ff,1).fillCircle(0,0,17).strokeCircle(0,0,17); this.player.gfx.lineStyle(2,0xc7ff52,.9).strokeCircle(0,0,8); this.player.gfx.fillStyle(0xffffff,1).fillCircle(0,0,3); this.player.add(this.player.gfx); this.player.speed=230; }
			makeHud(){
				this.ui=this.add.graphics(); this.ui.fillStyle(0x02070e,.92).fillRect(0,0,W,72); this.ui.lineStyle(1,0x39f6ff,.5).lineBetween(0,71,W,71);
				this.txt={ title:this.add.text(22,14,'QUARK',{fontFamily:'Space Mono',fontSize:18,color:'#39f6ff',fontStyle:'bold'}), sub:this.add.text(23,39,'ESCAPE VELOCITY',{fontFamily:'Space Mono',fontSize:9,color:'#668999'}), level:this.add.text(W/2,13,'LEVEL 01',{fontFamily:'Space Mono',fontSize:12,color:'#c7ff52'}), timer:this.add.text(W/2,34,'00:00',{fontFamily:'Space Mono',fontSize:24,color:'#ffffff'}), wave:this.add.text(W/2,57,'WAVE 01 // MATTER DETECTED',{fontFamily:'Space Mono',fontSize:9,color:'#ff4d9d'}), stats:this.add.text(W-22,14,'XP 0 / 20',{fontFamily:'Space Mono',fontSize:11,color:'#dffaff',align:'right'}).setOrigin(1,0), weapons:this.add.text(W-22,38,'λ 1   ✦ 1   H 1',{fontFamily:'Space Mono',fontSize:11,color:'#dffaff',align:'right'}).setOrigin(1,0), hp:this.add.text(22,78,'VITALITA QUARK',{fontFamily:'Space Mono',fontSize:9,color:'#ff4d9d'}), weaponList:this.add.text(W-22,78,'ARMI QUANTICHE',{fontFamily:'Space Mono',fontSize:9,color:'#39f6ff',align:'right'}).setOrigin(1,0), weaponNames:this.add.text(W-22,95,'',{fontFamily:'Space Mono',fontSize:8,color:'#dffaff',lineSpacing:2,align:'right'}).setOrigin(1,0) };
				this.txt.weaponNames.setText(Object.entries(weaponInfo).map(([key,info])=>info.icon+' '+info.name+'  LV '+this.stats[key]).join('\n'));
				this.xpBar=this.add.graphics(); this.xpBar.fillStyle(0x102734,1).fillRect(0,68,W,4);
				this.healthBar=this.add.graphics();
			}
			makeTouch(){
				this.joy=this.add.graphics().setDepth(20).setAlpha(.6); this.touchLabel=this.add.text(67,H-53,'MOVE',{fontFamily:'Space Mono',fontSize:9,color:'#9fc4ce'}).setDepth(20).setOrigin(.5); this.add.text(W-75,H-53,'AUTO FIRE',{fontFamily:'Space Mono',fontSize:9,color:'#9fc4ce'}).setDepth(20).setOrigin(.5);
			}
			update(){
				if(this.isGameOver||this.upgradeOpen||this.bossPhase&&this.boss&&!this.boss.active) return;
				const dt=Math.min(this.game.loop.delta/1000,.05); this.elapsed+=dt; this.updateHud(); this.movePlayer(dt); this.updateEnemies(dt); this.updateShots(dt); this.updateOrbs(dt); this.updateBoss(dt); this.joy.clear();
				const joyX=this.joystick.active?this.joystick.startX:67,joyY=this.joystick.active?this.joystick.startY:H-82; this.joy.lineStyle(2,0x39f6ff,.55).strokeCircle(joyX,joyY,43); this.joy.lineStyle(1,0x39f6ff,.3).strokeCircle(joyX,joyY,25); if(this.joystick.active){const dx=this.joystick.x-this.joystick.startX,dy=this.joystick.y-this.joystick.startY,len=Math.hypot(dx,dy)||1,scale=Math.min(1,62/len);this.joy.fillStyle(0x39f6ff,.7).fillCircle(joyX+dx*scale,joyY+dy*scale,12);}
				if(this.elapsed>=GAME_SECONDS&&!this.bossPhase) this.startBoss();
				this.autoFire();
			}
			updateHud(){ const s=Math.floor(this.elapsed),m=Math.floor(s/60),sec=s%60; this.txt.timer.setText(this.bossPhase?'BOSS // '+bosses[this.level-1][0]:String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')); this.txt.level.setText('LEVEL '+String(this.level).padStart(2,'0')); this.txt.wave.setText(this.bossPhase?'MOLECULAR THREAT // '+bosses[this.level-1][1].toUpperCase():'WAVE '+String(Math.min(9,Math.floor(this.elapsed/14)+1)).padStart(2,'0')+' // MATTER DETECTED'); this.txt.stats.setText('XP '+this.totalXP+' / '+this.nextXP); this.txt.weapons.setText(Object.keys(weaponInfo).map(key=>weaponInfo[key].icon+' '+this.stats[key]).join('   ')); this.txt.weaponNames.setText(Object.entries(weaponInfo).map(([key,info])=>info.icon+' '+info.name+'  LV '+this.stats[key]).join('\n')); this.txt.hp.setText('VITALITA QUARK  '+this.playerHP+' / '+this.maxPlayerHP); this.healthBar.clear().fillStyle(0x182631,1).fillRect(22,90,220,6).fillStyle(this.playerHP<=2?0xff4d9d:0xc7ff52,1).fillRect(22,90,220*(this.playerHP/this.maxPlayerHP),6); this.xpBar.clear().fillStyle(0xc7ff52,1).fillRect(0,68,W,4).fillStyle(0x030c16,1).fillRect(Math.min(W,this.totalXP/this.nextXP*W),68,W,4); }
			movePlayer(dt){ let x=0,y=0; if(this.keys.LEFT.isDown||this.keys.A.isDown)x--;if(this.keys.RIGHT.isDown||this.keys.D.isDown)x++;if(this.keys.UP.isDown||this.keys.W.isDown)y--;if(this.keys.DOWN.isDown||this.keys.S.isDown)y++; if(this.joystick.active){let dx=this.joystick.x-this.joystick.startX,dy=this.joystick.y-this.joystick.startY,len=Math.hypot(dx,dy);if(len>8){let force=Math.min(1,len/this.joystick.max);x+=(dx/len)*force;y+=(dy/len)*force;}} let len=Math.hypot(x,y)||1; this.player.x=Phaser.Math.Clamp(this.player.x+x/len*this.player.speed*dt,28,W-28);this.player.y=Phaser.Math.Clamp(this.player.y+y/len*this.player.speed*dt,95,H-28); }
			spawnEnemy(){ if(this.bossPhase||this.isGameOver)return; const edge=Phaser.Math.Between(0,3), pad=25; let x=edge<2?Phaser.Math.Between(pad,W-pad):edge===2?pad:W-pad,y=edge<2?(edge?H-pad:pad):Phaser.Math.Between(95,H-pad); let progress=Math.min(9,Math.floor(this.elapsed/14)); let type=progress<2?'atom':progress<5?'bacteria':'toxin'; let e=this.add.container(x,y); e.kind=type;e.hp=type==='atom'?1+Math.floor(progress*.5):type==='bacteria'?2+progress:3+Math.floor(progress*1.5);e.maxHp=e.hp;e.speed=(type==='atom'?58:type==='bacteria'?42:34)+progress*6;e.r=type==='atom'?12:type==='bacteria'?15:17;e.g=this.add.graphics(); if(type==='atom'){e.g.lineStyle(2,0xffce42,1).strokeCircle(0,0,11).lineStyle(1,0xff7552,.8).strokeEllipse(0,0,22,7).strokeEllipse(0,0,7,22);e.g.fillStyle(0xff7552,1).fillCircle(0,0,4);}else if(type==='bacteria'){e.g.fillStyle(0x54ffb4,1).fillCircle(0,0,14);e.g.lineStyle(2,0x03151c,1).strokeCircle(0,0,14);for(let i=0;i<5;i++)e.g.fillCircle(Math.cos(i)*15,Math.sin(i)*15,3);}else{e.g.fillStyle(0xff4d9d,1).fillTriangle(-15,10,0,-16,15,10);e.g.lineStyle(2,0xffb2d2,1).strokeTriangle(-15,10,0,-16,15,10);} e.add(e.g);this.enemies.push(e); }
			updateEnemies(dt){ for(let i=this.enemies.length-1;i>=0;i--){let e=this.enemies[i];if(!e.active){this.enemies.splice(i,1);continue;}let a=Phaser.Math.Angle.Between(e.x,e.y,this.player.x,this.player.y);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(Phaser.Math.Distance.Between(e.x,e.y,this.player.x,this.player.y)<e.r+14){this.playerHit(); e.destroy();} } }
			autoFire(){ const now=this.time.now; if(now-this.lastShot.photon>900/this.stats.photon){this.lastShot.photon=now;this.firePhoton();} if(now-this.lastShot.gluon>1500/this.stats.gluon){this.lastShot.gluon=now;this.fireGluon();} if(now-this.lastShot.higgs>2200/this.stats.higgs){this.lastShot.higgs=now;this.fireHiggs();} if(this.stats.electron&&now-this.lastShot.electron>1250/this.stats.electron){this.lastShot.electron=now;this.fireElectron();} if(this.stats.neutrino&&now-this.lastShot.neutrino>1800/this.stats.neutrino){this.lastShot.neutrino=now;this.fireNeutrino();} if(this.stats.antimatter&&now-this.lastShot.antimatter>2800/this.stats.antimatter){this.lastShot.antimatter=now;this.fireAntimatter();} if(this.stats.quarkstorm&&now-this.lastShot.quarkstorm>2100/this.stats.quarkstorm){this.lastShot.quarkstorm=now;this.fireQuarkstorm();} }
			nearest(){return this.enemies.filter(e=>e.active).sort((a,b)=>Phaser.Math.Distance.Between(this.player.x,this.player.y,a.x,a.y)-Phaser.Math.Distance.Between(this.player.x,this.player.y,b.x,b.y))[0]||this.boss;}
			firePhoton(){let t=this.nearest();if(!t)return;audio.laser();let p=this.add.graphics();p.lineStyle(3,0x58f6ff,1).lineBetween(0,0,28,0);p.x=this.player.x;p.y=this.player.y;p.rotation=Phaser.Math.Angle.Between(p.x,p.y,t.x,t.y);this.projectiles.push({g:p,target:t,dmg:4+2*this.stats.photon,kind:'photon',speed:590});}
			fireGluon(){let p=this.add.graphics();p.lineStyle(3,0xff4d9d,1).strokeCircle(0,0,9);p.x=this.player.x;p.y=this.player.y;this.projectiles.push({g:p,target:null,dmg:6+2*this.stats.gluon,kind:'gluon',life:1.2});}
			fireHiggs(){let p=this.add.graphics();p.fillStyle(0xc7ff52,.5).fillCircle(0,0,24+this.stats.higgs*3);p.lineStyle(2,0xc7ff52,1).strokeCircle(0,0,24+this.stats.higgs*3);p.x=this.player.x;p.y=this.player.y;this.projectiles.push({g:p,target:null,dmg:10+3*this.stats.higgs,kind:'higgs',life:.55});}
			fireElectron(){let p=this.add.graphics();p.lineStyle(3,0xffce42,1).strokeCircle(0,0,10);p.x=this.player.x;p.y=this.player.y;this.projectiles.push({g:p,target:null,dmg:8+3*this.stats.electron,kind:'electron',life:1.4,angle:this.time.now/500});}
			fireNeutrino(){let p=this.add.graphics();p.lineStyle(2,0xb4bfff,.9).lineBetween(0,-170,0,170);p.x=this.player.x;p.y=this.player.y;p.rotation=Phaser.Math.FloatBetween(0,Math.PI);this.projectiles.push({g:p,target:null,dmg:12+3*this.stats.neutrino,kind:'neutrino',life:.18});}
			fireAntimatter(){let p=this.add.graphics();p.lineStyle(3,0xff7552,1).strokeCircle(0,0,34+this.stats.antimatter*5);p.lineStyle(1,0xffffff,.8).strokeCircle(0,0,24);p.x=this.player.x;p.y=this.player.y;this.projectiles.push({g:p,target:null,dmg:24+6*this.stats.antimatter,kind:'antimatter',life:.25});}
			fireQuarkstorm(){let t=this.nearest();if(!t)return;let p=this.add.graphics();p.fillStyle(0x54ffb4,1).fillCircle(0,0,6);p.x=this.player.x;p.y=this.player.y;p.rotation=Phaser.Math.Angle.Between(p.x,p.y,t.x,t.y);this.projectiles.push({g:p,target:t,dmg:5+this.stats.quarkstorm,kind:'photon',speed:750});}
			updateShots(dt){for(let i=this.projectiles.length-1;i>=0;i--){let p=this.projectiles[i];if(!p.g.active){this.projectiles.splice(i,1);continue;}if(p.kind==='photon'){if(!p.target||!p.target.active){p.g.destroy();continue;}let a=Phaser.Math.Angle.Between(p.g.x,p.g.y,p.target.x,p.target.y);p.g.x+=Math.cos(a)*p.speed*dt;p.g.y+=Math.sin(a)*p.speed*dt;if(Phaser.Math.Distance.Between(p.g.x,p.g.y,p.target.x,p.target.y)<p.target.r+7){this.damage(p.target,p.dmg);p.g.destroy();}}else if(p.kind==='gluon'){p.life-=dt;p.g.x=this.player.x;p.g.y=this.player.y;this.enemies.forEach(e=>{if(Phaser.Math.Distance.Between(p.g.x,p.g.y,e.x,e.y)<75)this.damage(e,p.dmg*dt);});if(p.life<=0)p.g.destroy();}else if(p.kind==='electron'){p.life-=dt;p.angle+=dt*4;p.g.x=this.player.x+Math.cos(p.angle)*70;p.g.y=this.player.y+Math.sin(p.angle)*70;this.enemies.forEach(e=>{if(Phaser.Math.Distance.Between(p.g.x,p.g.y,e.x,e.y)<e.r+10)this.damage(e,p.dmg);});if(p.life<=0)p.g.destroy();}else{p.life-=dt;p.g.x=this.player.x;p.g.y=this.player.y;let range=p.kind==='antimatter'?90:38+this.stats.higgs*3;this.enemies.forEach(e=>{if(p.kind==='neutrino'||Phaser.Math.Distance.Between(p.g.x,p.g.y,e.x,e.y)<range)this.damage(e,p.dmg*dt);});if(p.life<=0)p.g.destroy();}}}
			damage(e,n){if(!e||!e.active)return;e.hp-=n;if(e.hp<=0){if(e===this.boss)this.killBoss();else{this.kills++;this.dropXP(e.x,e.y);e.destroy();}}}
			dropXP(x,y){let o=this.add.graphics();o.fillStyle(0xc7ff52,1).fillCircle(0,0,5);o.lineStyle(1,0xffffff,.7).strokeCircle(0,0,7);o.x=x;o.y=y;this.xpOrbs.push(o);}
			updateOrbs(dt){for(let i=this.xpOrbs.length-1;i>=0;i--){let o=this.xpOrbs[i],d=Phaser.Math.Distance.Between(o.x,o.y,this.player.x,this.player.y);if(d<130){let a=Phaser.Math.Angle.Between(o.x,o.y,this.player.x,this.player.y);o.x+=Math.cos(a)*180*dt;o.y+=Math.sin(a)*180*dt;}if(d<18){this.collectXP();o.destroy();this.xpOrbs.splice(i,1);}}}
			collectXP(){audio.orb();this.totalXP++;if(this.totalXP>=this.nextXP){this.totalXP-=this.nextXP;this.nextXP=Math.floor(this.nextXP*1.4);this.chooseUpgrade();}}
			chooseUpgrade(){if(this.upgradeOpen)return;audio.upgrade();this.upgradeOpen=true;this.physics.pause();let modal=this.add.container(0,0).setDepth(30);let shield=this.add.graphics().fillStyle(0x02070e,.78).fillRect(0,0,W,H);let panel=this.add.graphics().fillStyle(0x02070e,1).fillRect(210,170,680,350).lineStyle(2,0x39f6ff,1).strokeRect(210,170,680,350);modal.add([shield,panel]);let title=this.add.text(W/2,205,'QUANTUM UPGRADE // SCEGLI UNA SOLA ARMA',{fontFamily:'Space Mono',fontSize:17,color:'#39f6ff'}).setOrigin(.5);modal.add(title);let keys=Object.keys(weaponInfo).filter(k=>this.stats[k]<9).sort(()=>Math.random()-.5).slice(0,3);let cards=[];keys.forEach((k,i)=>{let x=295+i*255,info=weaponInfo[k],box=this.add.graphics().fillStyle(0x0b202b,1).fillRect(x-90,260,180,150).lineStyle(2,info.color,1).strokeRect(x-90,260,180,150).setInteractive(new Phaser.Geom.Rectangle(x-90,260,180,150),Phaser.Geom.Rectangle.Contains);let t=this.add.text(x,285,info.icon,{fontFamily:'Barlow Condensed',fontSize:42,color:'#'+info.color.toString(16).padStart(6,'0')}).setOrigin(.5);let n=this.add.text(x,335,info.name,{fontFamily:'Space Mono',fontSize:10,color:'#ffffff',align:'center',wordWrap:{width:160}}).setOrigin(.5);let d=this.add.text(x,378,'LV '+this.stats[k]+'  +1\n'+info.desc,{fontFamily:'Space Mono',fontSize:9,color:'#9fc4ce',align:'center'}).setOrigin(.5);modal.add([box,t,n,d]);cards.push({box,k});});cards.forEach(card=>card.box.on('pointerdown',()=>{if(!this.upgradeOpen)return;this.upgradeOpen=false;this.stats[card.k]=Math.min(9,this.stats[card.k]+1);modal.destroy(true,true);this.physics.resume();}));}
			playerHit(){if(this.isGameOver)return;audio.hit();this.player.alpha=.25;this.time.delayedCall(250,()=>this.player.alpha=1);this.playerHP--;if(this.playerHP<=0)this.gameOver();}
			startBoss(){audio.boss();this.bossPhase=true;this.enemies.forEach(e=>e.destroy());this.enemies=[];let data=bosses[this.level-1],b=this.add.container(W/2,170);b.name=data[0];b.hp=300+this.level*130;b.maxHp=b.hp;b.r=48;b.speed=38+this.level*3;b.g=this.add.graphics();b.g.fillStyle(0x07131e,1).lineStyle(4,data[2],1).fillCircle(0,0,48).strokeCircle(0,0,48);b.g.lineStyle(2,data[2],.7).strokeEllipse(0,0,94,26).strokeEllipse(0,0,26,94);b.g.fillStyle(data[2],1).fillCircle(0,0,15);b.add(b.g);this.boss=b;this.add.text(W/2,250,data[0],{fontFamily:'Space Mono',fontSize:18,color:'#ffffff',stroke:'#02070e',strokeThickness:5}).setOrigin(.5).setDepth(4);}
			updateBoss(dt){if(!this.bossPhase||!this.boss?.active)return;let b=this.boss,a=Phaser.Math.Angle.Between(b.x,b.y,this.player.x,this.player.y);b.x+=Math.cos(a)*b.speed*dt;b.y+=Math.sin(a)*b.speed*dt;b.x=Phaser.Math.Clamp(b.x,80,W-80);b.y=Phaser.Math.Clamp(b.y,110,H-120);if(Phaser.Math.Distance.Between(b.x,b.y,this.player.x,this.player.y)<62)this.playerHit();if(Math.random()<dt*.018*this.level){let orb=this.add.graphics().fillStyle(bosses[this.level-1][2],.7).fillCircle(0,0,9);orb.x=b.x;orb.y=b.y;this.tweens.add({targets:orb,x:this.player.x,y:this.player.y,duration:1300,onComplete:()=>{if(orb.active){if(Phaser.Math.Distance.Between(orb.x,orb.y,this.player.x,this.player.y)<24)this.playerHit();orb.destroy();}}});}}
			killBoss(){this.boss.destroy();this.bossPhase=false;this.elapsed=0;this.level++;if(this.level>10){this.win();return;}this.time.delayedCall(650,()=>this.chooseUpgrade());}
			gameOver(){audio.death();this.isGameOver=true;this.physics.pause();this.overlay('GAME OVER','Quark si è disperso nel rumore.','RIPROVA');}
			win(){this.isGameOver=true;this.physics.pause();this.overlay('SINGOLARITA RAGGIUNTA','Il regno microscopico non può più trattenerti.','NUOVA CORSA');}
			overlay(head,copy,button){let p=this.add.graphics().setDepth(50);p.fillStyle(0x02070e,.95).fillRect(250,210,600,260).lineStyle(2,0xff4d9d,1).strokeRect(250,210,600,260);this.add.text(W/2,270,head,{fontFamily:'Space Mono',fontSize:25,color:'#ff4d9d'}).setOrigin(.5).setDepth(51);this.add.text(W/2,320,copy,{fontFamily:'Barlow Condensed',fontSize:19,color:'#dffaff'}).setOrigin(.5).setDepth(51);let b=this.add.text(W/2,400,'[ '+button+' ]',{fontFamily:'Space Mono',fontSize:13,color:'#c7ff52',backgroundColor:'#0b202b',padding:{left:20,right:20,top:12,bottom:12}}).setOrigin(.5).setDepth(51).setInteractive();b.on('pointerdown',()=>this.scene.restart());}
		}
		new Phaser.Game({type:Phaser.AUTO,parent:'game',width:W,height:H,backgroundColor:'#030c16',physics:{default:'arcade',arcade:{debug:false}},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Main]});
		if('serviceWorker' in navigator && location.protocol!=='file:') window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}));
	})();
	</script>
